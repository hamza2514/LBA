<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  :root { --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; --accent:#2563eb; --bg:#ffffff; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color:var(--ink); font-size:13px; background:transparent; }
  .wrap { border:1px solid var(--line); border-radius:12px; overflow:auto; max-height:680px; background:var(--bg); box-shadow:0 1px 2px rgba(15,23,42,.04); }
  table { border-collapse:separate; border-spacing:0; width:100%; }
  thead th { position:sticky; top:0; z-index:2; background:#0f172a; color:#fff; text-align:left; font-weight:600; padding:10px 10px; font-size:12px; white-space:nowrap; }
  tbody td { padding:7px 10px; border-bottom:1px solid var(--line); vertical-align:middle; background:var(--row, #fff); }
  tbody tr:hover td { filter:brightness(.97); }
  td.num, th.num { text-align:right; }
  td.op { min-width:260px; max-width:420px; }
  td.mt { color:var(--muted); white-space:nowrap; }
  .handle { cursor:grab; color:#94a3b8; font-size:16px; user-select:none; width:26px; text-align:center; padding:0 4px; }
  .handle:active { cursor:grabbing; }
  tr.dragging td { opacity:.4; }
  tr.drop-before td { box-shadow: inset 0 2px 0 var(--accent); }
  tr.drop-after td { box-shadow: inset 0 -2px 0 var(--accent); }
  .emp { display:flex; align-items:center; gap:6px; justify-content:space-between; min-width:120px; border:1px solid #cbd5e1; border-radius:8px; padding:5px 8px; background:#fff; cursor:pointer; font-weight:600; }
  .emp:hover { border-color:var(--accent); }
  .emp.empty { color:#b91c1c; border-color:#fecaca; background:#fef2f2; }
  .emp .chev { color:#94a3b8; font-size:10px; }
  .pill { display:inline-block; padding:2px 9px; border-radius:999px; font-size:11px; font-weight:600; }
  .pill.System { background:#dbeafe; color:#1d4ed8; }
  .pill.Manual { background:#fef3c7; color:#b45309; }
  #pop { position:fixed; z-index:50; width:380px; max-height:340px; background:#fff; border:1px solid #cbd5e1; border-radius:12px; box-shadow:0 12px 32px rgba(15,23,42,.18); display:none; flex-direction:column; overflow:hidden; }
  #pop input { border:0; border-bottom:1px solid var(--line); padding:11px 12px; font-size:13px; outline:none; }
  #list { overflow:auto; }
  .grp { padding:6px 12px; font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; background:#f8fafc; }
  .item { padding:8px 12px; cursor:pointer; border-bottom:1px solid #f1f5f9; }
  .item:hover, .item.active { background:#eff6ff; }
  .item .top { display:flex; gap:8px; align-items:baseline; }
  .item .code { font-weight:700; }
  .item .line { color:var(--muted); font-size:11px; margin-left:auto; }
  .item .busy { color:#b45309; font-size:11px; }
  .item .sk { font-size:11.5px; margin-top:2px; }
  .sk.ok { color:#15803d; } .sk.other { color:var(--muted); }
  .clear { color:#b91c1c; font-weight:600; }
  .none { padding:14px; color:var(--muted); }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <table>
    <thead><tr>
      <th></th><th>Line</th><th>Operation</th><th>Machine Type</th><th class="num">SAM</th>
      <th>Employee Code</th><th>Employee Name</th><th class="num">Target</th><th>Assigned By</th>
    </tr></thead>
    <tbody id="body"></tbody>
  </table>
</div>
<div id="pop"><input id="q" placeholder="Search code, name or skill…" autocomplete="off" /><div id="list"></div></div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  let args = null, lastSig = "", rows = {}, emps = {}, order = [], assign = {}, palette = [];
  let dragId = null, dropTarget = null, dropPos = "before", openRow = null, activeIdx = 0, visibleItems = [];

  const post = (type, extra) => window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type }, extra), "*");
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const emit = () => post("streamlit:setComponentValue", { value: { order: order.slice(), assign: Object.assign({}, assign) }, dataType: "json" });

  window.addEventListener("message", (e) => {
    if (!e.data || e.data.type !== "streamlit:render") return;
    args = e.data.args;
    const sig = JSON.stringify(args);
    if (sig !== lastSig) {              // only reset local state when Python sent something new
      lastSig = sig;
      rows = {}; args.rows.forEach((r) => (rows[r.id] = r));
      emps = args.employees; palette = args.palette;
      order = args.order.slice(); assign = Object.assign({}, args.assign);
      closePicker(); render();
    }
  });
  post("streamlit:componentReady", { apiVersion: 1 });

  function colors() {
    const counts = {}, map = {};
    order.forEach((id) => { const c = assign[id]; if (c) counts[c] = (counts[c] || 0) + 1; });
    order.forEach((id) => { const c = assign[id]; if (c && counts[c] > 1 && !(c in map)) map[c] = palette[Object.keys(map).length % palette.length]; });
    return map;
  }

  function render() {
    const cmap = colors(), tb = $("body");
    tb.innerHTML = "";
    order.forEach((id) => {
      const r = rows[id], code = assign[id] || "", e = code ? emps[code] : null;
      const manual = code !== r.sys;
      const tr = document.createElement("tr");
      tr.dataset.id = id;
      if (code && cmap[code]) tr.style.setProperty("--row", cmap[code]);
      tr.innerHTML =
        `<td class="handle" draggable="true" title="Drag to reorder">⠿</td>` +
        `<td>${esc(r.line)}</td><td class="op">${esc(r.operation)}</td><td class="mt">${esc(r.machine)}</td>` +
        `<td class="num">${esc(r.sam)}</td>` +
        `<td><div class="emp ${code ? "" : "empty"}" data-pick="${esc(id)}"><span>${code ? esc(code) : "Unassigned"}</span><span class="chev">▼</span></div></td>` +
        `<td>${e ? esc(e.name) : (code ? esc(code) : "")}</td><td class="num">${esc(r.target)}</td>` +
        `<td><span class="pill ${manual ? "Manual" : "System"}">${manual ? "Manual" : "System"}</span></td>`;
      tb.appendChild(tr);

      const h = tr.querySelector(".handle");
      h.addEventListener("dragstart", (ev) => { dragId = id; tr.classList.add("dragging"); ev.dataTransfer.effectAllowed = "move"; ev.dataTransfer.setData("text/plain", id); });
      h.addEventListener("dragend", () => { dragId = null; clearDropMarks(); tr.classList.remove("dragging"); });
      tr.addEventListener("dragover", (ev) => {
        if (!dragId || dragId === id) return;
        ev.preventDefault();
        const rect = tr.getBoundingClientRect();
        dropPos = ev.clientY < rect.top + rect.height / 2 ? "before" : "after";
        dropTarget = id; clearDropMarks(); tr.classList.add("drop-" + dropPos);
      });
      tr.addEventListener("drop", (ev) => { ev.preventDefault(); if (dragId && dropTarget) moveRow(dragId, dropTarget, dropPos); });
      tr.querySelector("[data-pick]").addEventListener("click", (ev) => openPicker(id, ev.currentTarget));
    });
    resize();
  }

  function clearDropMarks() { document.querySelectorAll(".drop-before,.drop-after").forEach((n) => n.classList.remove("drop-before", "drop-after")); }
  function moveRow(from, to, pos) {
    order = order.filter((x) => x !== from);
    const i = order.indexOf(to);
    order.splice(pos === "before" ? i : i + 1, 0, from);
    dragId = null; clearDropMarks(); render(); emit();
  }
  function resize() {
    const h = Math.min($("wrap").scrollHeight, 680) + 12;
    post("streamlit:setFrameHeight", { height: Math.max(h, 400) });
  }

  // ---- searchable employee picker ------------------------------------------------
  function skillOf(code, row) {
    const e = emps[code];
    if (e.by_sg[row.sg]) return { text: e.by_sg[row.sg], ok: true };
    const all = e.all.join(", ") + (e.more ? ` +${e.more} more` : "");
    return { text: all || "No skills on record", ok: false };
  }
  function loadOf(code) { return order.filter((id) => assign[id] === code).length; }

  function openPicker(rowId, anchor) {
    openRow = rowId; $("q").value = ""; buildList();
    const pop = $("pop"); pop.style.display = "flex";
    const rect = anchor.getBoundingClientRect(), ph = pop.offsetHeight, pw = pop.offsetWidth;
    let top = rect.bottom + 4;
    if (top + ph > window.innerHeight - 4) top = Math.max(4, rect.top - ph - 4);
    pop.style.top = top + "px";
    pop.style.left = Math.max(4, Math.min(rect.left, window.innerWidth - pw - 8)) + "px";
    $("q").focus();
  }
  function closePicker() { openRow = null; $("pop").style.display = "none"; }

  function itemHtml(code, row, idx) {
    const e = emps[code], sk = skillOf(code, row), n = loadOf(code);
    return `<div class="item" data-i="${idx}" data-code="${esc(code)}"><div class="top"><span class="code">${esc(code)}</span><span>${esc(e.name)}</span>` +
      `${n ? `<span class="busy">on ${n} row${n > 1 ? "s" : ""}</span>` : ""}<span class="line">${esc(e.line)}</span></div>` +
      `<div class="sk ${sk.ok ? "ok" : "other"}">${sk.ok ? "✓ " : "Other skills: "}${esc(sk.text)}</div></div>`;
  }

  function buildList() {
    const row = rows[openRow], q = $("q").value.trim().toLowerCase(), list = $("list");
    visibleItems = []; let html = "";
    const sug = row.suggest.filter((c) => emps[c]);
    if (!q) {
      if (assign[openRow]) { visibleItems.push(""); html += `<div class="item clear" data-i="0" data-code="">✕ Clear assignment</div>`; }
      html += `<div class="grp">Qualified for this operation (${sug.length})</div>`;
      if (!sug.length) html += `<div class="none">Nobody is qualified — type to search all employees.</div>`;
      sug.forEach((c) => { html += itemHtml(c, row, visibleItems.length); visibleItems.push(c); });
    } else {
      const toks = q.split(/\s+/);
      const hit = Object.keys(emps).filter((c) => {
        const e = emps[c], hay = (c + " " + e.name + " " + e.line + " " + e.all.join(" ") + " " + Object.values(e.by_sg).join(" ")).toLowerCase();
        return toks.every((t) => hay.includes(t));
      });
      const ss = new Set(sug);
      hit.sort((a, b) => (ss.has(b) - ss.has(a)) || a.localeCompare(b));
      html += `<div class="grp">${hit.length} match${hit.length === 1 ? "" : "es"}</div>`;
      if (!hit.length) html += `<div class="none">No employee found.</div>`;
      hit.slice(0, 60).forEach((c) => { html += itemHtml(c, row, visibleItems.length); visibleItems.push(c); });
    }
    list.innerHTML = html; activeIdx = 0; markActive();
    list.querySelectorAll(".item").forEach((n) => n.addEventListener("click", () => choose(n.dataset.code)));
  }
  function markActive() {
    document.querySelectorAll("#list .item").forEach((n, i) => n.classList.toggle("active", i === activeIdx));
    const a = document.querySelector("#list .item.active"); if (a) a.scrollIntoView({ block: "nearest" });
  }
  function choose(code) {
    if (openRow == null) return;
    assign[openRow] = code; closePicker(); render(); emit();
  }

  $("q").addEventListener("input", buildList);
  $("q").addEventListener("keydown", (e) => {
    const items = document.querySelectorAll("#list .item");
    if (e.key === "ArrowDown") { activeIdx = Math.min(items.length - 1, activeIdx + 1); markActive(); e.preventDefault(); }
    else if (e.key === "ArrowUp") { activeIdx = Math.max(0, activeIdx - 1); markActive(); e.preventDefault(); }
    else if (e.key === "Enter") { const n = items[activeIdx]; if (n) choose(n.dataset.code); e.preventDefault(); }
    else if (e.key === "Escape") closePicker();
  });
  document.addEventListener("mousedown", (e) => { if (openRow && !$("pop").contains(e.target) && !e.target.closest("[data-pick]")) closePicker(); });
})();
</script>
</body>
</html>
